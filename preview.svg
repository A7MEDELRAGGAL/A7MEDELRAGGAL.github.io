<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="'Fira Code',monospace">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c896"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="rgba(0,200,150,0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="320" rx="16" fill="#0b1220" stroke="rgba(0,200,150,0.25)"/>
  <text x="300" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="url(#g)">⚡ FLAG HUNTER</text>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#8b949e">neon snake · built by Ahmed El-Raggal</text>

  <rect x="40" y="86" width="520" height="176" rx="12" fill="#07120c" stroke="rgba(0,200,150,0.3)"/>
  <rect x="40" y="86" width="520" height="176" rx="12" fill="url(#grid)"/>

  <!-- flag -->
  <text x="470" y="212" font-size="26" text-anchor="middle">🚩
    <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- snake -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 360 0; 0 0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    <rect x="150" y="150" width="22" height="22" rx="6" fill="#38e0b0"/>
    <rect x="126" y="150" width="22" height="22" rx="6" fill="#00c896" opacity="0.9"/>
    <rect x="102" y="150" width="22" height="22" rx="6" fill="#00c896" opacity="0.7"/>
    <rect x="78" y="150" width="22" height="22" rx="6" fill="#00c896" opacity="0.5"/>
    <rect x="54" y="150" width="22" height="22" rx="6" fill="#00c896" opacity="0.35"/>
  </g>

  <text x="300" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#00c896">▶ CLICK TO PLAY
    <animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/>
  </text>
</svg>
