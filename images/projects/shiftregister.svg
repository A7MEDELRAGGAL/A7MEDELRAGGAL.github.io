<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="ard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00979D"/>
      <stop offset="1" stop-color="#006B6F"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="800" height="520" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Consolas, monospace" font-size="28" font-weight="bold" fill="#ffffff">4-Bit Shift Register</text>
  <text x="40" y="80" font-family="Consolas, monospace" font-size="15" fill="#93c5fd">74HC595 · Serial to Parallel · SPI · Arduino Uno</text>

  <!-- Arduino block -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="180" height="300" rx="14" fill="url(#ard)"/>
    <rect x="70" y="142" width="160" height="120" rx="8" fill="#ffffff" opacity="0.12"/>
    <text x="150" y="175" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ARDUINO</text>
    <text x="150" y="198" font-family="Arial" font-size="13" fill="#d1fae5" text-anchor="middle">UNO · ATmega328P</text>
    <rect x="78" y="230" width="40" height="14" rx="3" fill="#111827" opacity="0.7"/>
    <rect x="90" y="250" width="16" height="16" rx="8" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
    <text x="98" y="263" font-family="Arial" font-size="9" fill="#78350f" text-anchor="middle" font-weight="bold">13</text>
    <text x="150" y="310" font-family="Consolas, monospace" font-size="15" fill="#ffffff">D6 = ST_CP</text>
    <text x="150" y="342" font-family="Consolas, monospace" font-size="15" fill="#ffffff">D7 = SH_CP</text>
    <text x="150" y="374" font-family="Consolas, monospace" font-size="15" fill="#ffffff">D8 = DATA</text>
    <text x="150" y="406" font-family="Consolas, monospace" font-size="13" fill="#a7f3d0">5V · GND</text>
  </g>

  <!-- wires -->
  <g stroke="#fbbf24" stroke-width="3" fill="none">
    <path d="M240 300 H300 V310 H330"/>
  </g>
  <g stroke="#38bdf8" stroke-width="3" fill="none">
    <path d="M240 332 H300 V338 H330"/>
  </g>
  <g stroke="#34d399" stroke-width="3" fill="none">
    <path d="M240 364 H300 V370 H330"/>
  </g>
  <g stroke="#e879f9" stroke-width="3" fill="none">
    <path d="M240 300 H300 M240 332 H300 M240 364 H300"/>
  </g>
  <g stroke="#f8fafc" stroke-width="3" fill="none">
    <path d="M240 150 H300 M240 396 H300"/>
  </g>
  <text x="286" y="296" font-family="Consolas, monospace" font-size="12" fill="#fbbf24" text-anchor="end">ST_CP</text>
  <text x="286" y="330" font-family="Consolas, monospace" font-size="12" fill="#38bdf8" text-anchor="end">SH_CP</text>
  <text x="275" y="362" font-family="Consolas, monospace" font-size="12" fill="#34d399" text-anchor="end">DS</text>

  <!-- 74HC595 -->
  <g filter="url(#shadow)">
    <rect x="330" y="150" width="180" height="250" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <rect x="336" y="156" width="168" height="46" rx="6" fill="#1e293b"/>
    <text x="420" y="176" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#7dd3fc" text-anchor="middle">74HC595</text>
    <text x="420" y="195" font-family="Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">8-BIT SHIFT REGISTER</text>
    <!-- pins -->
    <g font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">
      <rect x="330" y="225" width="38" height="16" fill="#334155"/><text x="340" y="237" text-anchor="start">DS</text>
      <rect x="330" y="255" width="46" height="16" fill="#334155"/><text x="340" y="267" text-anchor="start">SHCP</text>
      <rect x="330" y="285" width="46" height="16" fill="#334155"/><text x="340" y="297" text-anchor="start">STCP</text>
      <rect x="472" y="225" width="38" height="16" fill="#334155"/><text x="510" y="237" text-anchor="end">Q0</text>
      <rect x="472" y="255" width="38" height="16" fill="#334155"/><text x="510" y="267" text-anchor="end">Q1</text>
      <rect x="472" y="285" width="38" height="16" fill="#334155"/><text x="510" y="297" text-anchor="end">Q2</text>
      <rect x="472" y="315" width="38" height="16" fill="#334155"/><text x="510" y="327" text-anchor="end">Q3</text>
      <rect x="330" y="340" width="46" height="16" fill="#334155"/><text x="340" y="352" text-anchor="start">GND</text>
      <rect x="472" y="340" width="46" height="16" fill="#334155"/><text x="510" y="352" text-anchor="end">VCC</text>
    </g>
    <text x="420" y="382" font-family="Consolas, monospace" font-size="11" fill="#64748b" text-anchor="middle">Serial In → Parallel Out</text>
  </g>

  <!-- LED outputs -->
  <g>
    <g stroke="#f43f5e" stroke-width="3" fill="none">
      <path d="M510 233 H560 V236"/><path d="M510 263 H560 V266"/>
      <path d="M510 293 H560 V296"/><path d="M510 323 H560 V326"/>
    </g>
    <g stroke="#f87171" stroke-width="3" fill="none">
      <path d="M560 300 H640"/>
    </g>
    <g font-family="Consolas, monospace" font-size="12" fill="#fda4af">
      <text x="570" y="228">R0 220Ω</text>
      <text x="570" y="258">R1 220Ω</text>
      <text x="570" y="288">R2 220Ω</text>
      <text x="570" y="318">R3 220Ω</text>
    </g>
    <!-- LEDs -->
    <g>
      <circle cx="585" cy="210" r="22" fill="#fecdd3" stroke="#e11d48" stroke-width="3"/>
      <text x="585" y="216" font-family="Consolas, monospace" font-size="12" fill="#9f1239" text-anchor="middle" font-weight="bold">LED0</text>
      <circle cx="585" cy="240" r="22" fill="#fecdd3" stroke="#e11d48" stroke-width="3"/>
      <text x="585" y="246" font-family="Consolas, monospace" font-size="12" fill="#9f1239" text-anchor="middle" font-weight="bold">LED1</text>
      <circle cx="585" cy="270" r="22" fill="#fecdd3" stroke="#e11d48" stroke-width="3"/>
      <text x="585" y="276" font-family="Consolas, monospace" font-size="12" fill="#9f1239" text-anchor="middle" font-weight="bold">LED2</text>
      <circle cx="585" cy="300" r="22" fill="#fecdd3" stroke="#e11d48" stroke-width="3"/>
      <text x="585" y="306" font-family="Consolas, monospace" font-size="12" fill="#9f1239" text-anchor="middle" font-weight="bold">LED3</text>
    </g>
    <path d="M610 330 H640" stroke="#e11d48" stroke-width="3"/>
    <text x="650" y="336" font-family="Consolas, monospace" font-size="12" fill="#fda4af">GND</text>
  </g>

  <text x="400" y="470" font-family="Consolas, monospace" font-size="13" fill="#94a3b8" text-anchor="middle">Latch the clock · read MSB-first · 4 LEDs light the shifted bits</text>
</svg>